# A cada envio para o GitHub: confere o compilador e a linguagem antes que um erro chegue aos professores.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Nenhum commit com e-mail pessoal (só o noreply do GitHub)
        shell: bash
        run: |
          # noreply@github.com: o próprio GitHub, nos merges de Pull Request (ex.: os do Dependabot)
          ruins=$(git log --format='%h %ae %ce' | awk 'function ok(e) { return e ~ /@users\.noreply\.github\.com$/ || e == "noreply@github.com" } !ok($2) || !ok($3)')
          if [ -n "$ruins" ]; then echo "Commits com e-mail que não é o noreply do GitHub:"; echo "$ruins"; exit 1; fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Todos os arquivos Python compilam
        run: python -m compileall -q .
      - name: Conferência com os programas da IDE e testes da linguagem (avisos, espaço do robô, salvar .est)
        run: python verificar_gabaritos.py
      - name: Os programas do teste geral compilam
        run: python ferramentas/teste_geral.py --sem-robo
      - name: Os arquivos JavaScript não têm erro de escrita
        shell: bash
        run: for f in simulador/*.js docs/simulador/*.js docs/programar/*.js docs/programar/simulador/*.js; do node --check "$f"; done
      - name: Arena da OBR do simulador (pontuação como no manual)
        run: node ferramentas/teste_obr.js
      - name: Protocolo da página de programar (USB e Bluetooth)
        run: node ferramentas/teste_protocolo.js
      - name: Versões do programa guardadas na página de programar
        run: node ferramentas/teste_versoes.js
      - name: Simulador (giroscópio, motor, cronômetro, mensagens, caminho do Dirigir, seguidor, gráfico dos sensores)
        run: python ferramentas/teste_simulador.py
      - name: Ida e volta Python -> blocos -> Python (mesmos bytes)
        shell: bash
        run: |
          # o mesmo Blockly da página (a versão está no modo_blocos.js)
          versao=$(grep -o "const VERSAO = '[^']*'" docs/programar/modo_blocos.js | cut -d"'" -f2)
          npm install --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/blockly" "blockly@$versao"
          BLOCKLY_DIR="$RUNNER_TEMP/blockly/node_modules/blockly" python ferramentas/teste_blocos.py
      - name: Pacote para Windows (pasta do aluno limpa, Python dentro, Atualizar o projeto)
        run: python ferramentas/empacotar.py --testar
      - name: O tasks.json do VS Code é válido
        run: python -c "import json; json.load(open('.vscode/tasks.json', encoding='utf-8'))"
